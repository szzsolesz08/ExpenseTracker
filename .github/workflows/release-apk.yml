# Builds the release APK on every push to main and attaches it (with its SHA-256) to the workflow run.
#
# Caching, so repeat builds are fast:
#   - Gradle User Home (wrapper, dependencies, transforms) and the local Gradle build cache
#     (org.gradle.caching=true), restored by setup-gradle: unchanged tasks are loaded, not re-run.
#   - Gradle configuration cache: also reused when the optional GRADLE_ENCRYPTION_KEY secret is set.
#   - Android SDK platform/build-tools and Robolectric's Android jars, via actions/cache.
#
# Signing: if the ANDROID_KEYSTORE_* secrets are set (see README, "Continuous integration"), the APK is
# signed with your release key; otherwise an unsigned release APK is produced. No key is ever generated here.
#
# GitHub release: when the tag v<versionName> (from app/build.gradle.kts) does not exist yet, the run creates
# that release on the pushed commit with the APK and its checksum attached. Bump versionName for a new release;
# pushes without a bump only attach the APK to the workflow run. Unsigned APKs are never published as a release,
# because Android refuses to install them.

name: Release APK

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PLATFORM_DIR: android-37.0
  ANDROID_BUILD_TOOLS: 37.0.0

jobs:
  release-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the GitHub release and its tag

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v6
        with:
          # Optional. When set, the Gradle configuration cache is saved and reused between runs too.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Locate Android SDK
        run: echo "ANDROID_SDK_DIR=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Cache Android SDK packages
        id: sdk-cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.ANDROID_SDK_DIR }}/platforms/${{ env.ANDROID_PLATFORM_DIR }}
            ${{ env.ANDROID_SDK_DIR }}/build-tools/${{ env.ANDROID_BUILD_TOOLS }}
          key: android-sdk-${{ runner.os }}-${{ env.ANDROID_PLATFORM_DIR }}-${{ env.ANDROID_BUILD_TOOLS }}

      - name: Install Android SDK packages
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;$ANDROID_PLATFORM_DIR" "build-tools;$ANDROID_BUILD_TOOLS"

      - name: Cache Robolectric Android jars
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-

      - name: Configure release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice title=Unsigned release APK::No ANDROID_KEYSTORE_BASE64 secret is set, so the release APK is unsigned."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Unit tests and release build
        run: ./gradlew --stacktrace test assembleRelease

      - name: Collect APK and checksum
        id: collect
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          BASE="KiadasKoveto-$VERSION-${GITHUB_SHA::7}"
          mkdir -p dist
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/KiadasKoveto-$VERSION-release.apk"
            SIGNED=true
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/KiadasKoveto-$VERSION-release-unsigned.apk"
            SIGNED=false
          fi
          (cd dist && sha256sum ./*.apk | sed 's| \./| |' > SHA256SUMS.txt)
          {
            echo "artifact=$BASE"
            echo "version=$VERSION"
            echo "signed=$SIGNED"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Release APK"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.collect.outputs.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          # APKs are already compressed.
          compression-level: 0

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.collect.outputs.version }}
          SIGNED: ${{ steps.collect.outputs.signed }}
        run: |
          TAG="v$VERSION"
          if [ "$SIGNED" != "true" ]; then
            echo "::warning title=No release published::The APK is unsigned and Android cannot install it, so no GitHub release is created. Set the ANDROID_KEYSTORE_* secrets (see README)."
            exit 0
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice title=No new release::Release $TAG already exists. Bump versionName in app/build.gradle.kts to publish a new one; this build is attached to the workflow run."
            exit 0
          fi
          NOTES="$RUNNER_TEMP/notes.md"
          {
            echo "Offline Hungarian receipt and expense tracker for Android 10+ (KiadásKövető $VERSION)."
            echo "Built from ${GITHUB_SHA::7} by [this workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            echo "**Install:** allow \"Install unknown apps\" for your file manager, then open the APK on the phone."
            echo
            echo "SHA-256:"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > "$NOTES"
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "KiadásKövető $VERSION" --notes-file "$NOTES"
          echo "Published release $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
